<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tomorrow's Daily Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --card-border: #1e293b;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent-high: #f87171;
      --accent-med: #fbbf24;
      --accent-low: #34d399;
      --radius: 12px;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 680px;
      margin: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header & Progress Card */
    .header-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .date-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: rgba(56, 189, 248, 0.1);
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
    }

    .stats-info {
      text-align: right;
    }

    .stats-percent {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--primary);
    }

    .stats-label {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .progress-bar-bg {
      background: #1e293b;
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
      width: 100%;
    }

    .progress-bar-fill {
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Form Card */
    .input-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 16px;
    }

    .form-row-main {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    input[type="text"] {
      flex: 1;
      background: #090d16;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px 14px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: var(--transition);
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    .form-options {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 8px;
    }

    @media (max-width: 540px) {
      .form-row-main {
        flex-direction: column;
      }
      .form-options {
        grid-template-columns: 1fr 1fr;
      }
      .btn-submit {
        grid-column: span 2;
      }
    }

    select, input[type="time"] {
      background: #090d16;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 0.85rem;
      outline: none;
      width: 100%;
    }

    select:focus, input[type="time"]:focus {
      border-color: var(--primary);
    }

    .btn-submit {
      background: var(--primary);
      color: #090d16;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .btn-submit:hover {
      background: var(--primary-hover);
    }

    /* Filter Chips */
    .filter-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .filter-bar::-webkit-scrollbar {
      display: none;
    }

    .filter-chip {
      background: #131b2e;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: var(--transition);
    }

    .filter-chip.active {
      background: var(--primary);
      color: #090d16;
      border-color: var(--primary);
      font-weight: 600;
    }

    /* Task List */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: var(--transition);
    }

    .task-item:hover {
      border-color: #334155;
    }

    .task-item.completed {
      opacity: 0.6;
    }

    .task-item.completed .task-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .custom-checkbox {
      appearance: none;
      width: 22px;
      height: 22px;
      border: 2px solid #475569;
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      display: grid;
      place-content: center;
      transition: var(--transition);
      flex-shrink: 0;
    }

    .custom-checkbox:checked {
      background: var(--primary);
      border-color: var(--primary);
    }

    .custom-checkbox:checked::after {
      content: "✓";
      color: #090d16;
      font-size: 14px;
      font-weight: bold;
    }

    .task-content {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .task-title {
      font-size: 0.95rem;
      color: #f1f5f9;
      word-break: break-word;
    }

    .task-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .p-high { background: rgba(248, 113, 113, 0.15); color: var(--accent-high); }
    .p-med { background: rgba(251, 191, 36, 0.15); color: var(--accent-med); }
    .p-low { background: rgba(52, 211, 153, 0.15); color: var(--accent-low); }

    .category-tag {
      background: #1e293b;
      color: var(--text-muted);
      font-size: 0.7rem;
      padding: 2px 7px;
      border-radius: 4px;
    }

    .time-tag {
      font-size: 0.7rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .btn-delete {
      background: transparent;
      border: none;
      color: #64748b;
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      font-size: 1rem;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-delete:hover {
      color: var(--accent-high);
      background: rgba(248, 113, 113, 0.1);
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 40px 16px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Actions Bar */
    .footer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .clear-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
    }

    .clear-btn:hover {
      color: #fff;
    }
  </style>
</head>
<body>

  <main class="container">
    <!-- Header & Progress -->
    <header class="header-card">
      <div class="header-top">
        <div>
          <span class="date-badge">Planning Ahead</span>
          <h1 id="tomorrowDateHeading">Tomorrow's Schedule</h1>
        </div>
        <div class="stats-info">
          <div class="stats-percent" id="statsPercent">0%</div>
          <div class="stats-label" id="statsRatio">0 / 0 done</div>
        </div>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
    </header>

    <!-- Plan Input Form -->
    <section class="input-card">
      <form id="planForm">
        <div class="form-row-main">
          <input type="text" id="taskTitle" placeholder="What are you planning for tomorrow?" required autocomplete="off" />
        </div>
        <div class="form-options">
          <input type="time" id="taskTime" title="Optional time slot" />
          <select id="taskCategory">
            <option value="General">General</option>
            <option value="Study">Study</option>
            <option value="Work">Work</option>
            <option value="Workout">Workout</option>
            <option value="Personal">Personal</option>
          </select>
          <select id="taskPriority">
            <option value="med">Medium</option>
            <option value="high">High</option>
            <option value="low">Low</option>
          </select>
          <button type="submit" class="btn-submit">Add Plan</button>
        </div>
      </form>
    </section>

    <!-- Category Filter Bar -->
    <nav class="filter-bar" id="filterBar">
      <button class="filter-chip active" data-filter="All">All</button>
      <button class="filter-chip" data-filter="Study">Study</button>
      <button class="filter-chip" data-filter="Work">Work</button>
      <button class="filter-chip" data-filter="Workout">Workout</button>
      <button class="filter-chip" data-filter="Personal">Personal</button>
      <button class="filter-chip" data-filter="General">General</button>
    </nav>

    <!-- Tasks List Container -->
    <section class="task-list" id="taskList"></section>

    <!-- Bottom Controls -->
    <footer class="footer-actions">
      <button class="clear-btn" id="clearCompletedBtn">Clear Completed</button>
      <button class="clear-btn" id="resetAllBtn">Reset All</button>
    </footer>
  </main>

  <script>
    // Set Tomorrow's Date Heading
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    const dateFormatted = tomorrow.toLocaleDateString(undefined, {
      weekday: 'long',
      month: 'short',
      day: 'numeric'
    });
    document.getElementById('tomorrowDateHeading').textContent = dateFormatted;

    // State
    let currentFilter = 'All';
    let plans = JSON.parse(localStorage.getItem('tomorrows_plans_v2') || '[]');

    // Elements
    const form = document.getElementById('planForm');
    const titleInput = document.getElementById('taskTitle');
    const timeInput = document.getElementById('taskTime');
    const catInput = document.getElementById('taskCategory');
    const priorityInput = document.getElementById('taskPriority');
    const taskListEl = document.getElementById('taskList');
    const progressBar = document.getElementById('progressBar');
    const statsPercent = document.getElementById('statsPercent');
    const statsRatio = document.getElementById('statsRatio');
    const filterBar = document.getElementById('filterBar');
    const clearCompletedBtn = document.getElementById('clearCompletedBtn');
    const resetAllBtn = document.getElementById('resetAllBtn');

    // Persistence & Rendering
    function saveAndRender() {
      localStorage.setItem('tomorrows_plans_v2', JSON.stringify(plans));
      renderTasks();
      updateStats();
    }

    function updateStats() {
      const total = plans.length;
      const completed = plans.filter(p => p.completed).length;
      const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);

      progressBar.style.width = percentage + '%';
      statsPercent.textContent = percentage + '%';
      statsRatio.textContent = `${completed} / ${total} done`;
    }

    function renderTasks() {
      taskListEl.innerHTML = '';

      const filtered = plans.filter(p => currentFilter === 'All' || p.category === currentFilter);

      if (filtered.length === 0) {
        taskListEl.innerHTML = `
          <div class="empty-state">
            No plans scheduled ${currentFilter === 'All' ? 'yet' : 'under ' + currentFilter}. Add one above!
          </div>
        `;
        return;
      }

      // Sort: incomplete first, then by priority/time
      filtered.sort((a, b) => (a.completed === b.completed ? 0 : a.completed ? 1 : -1));

      filtered.forEach(item => {
        const div = document.createElement('div');
        div.className = `task-item ${item.completed ? 'completed' : ''}`;

        const formattedTime = item.time ? formatTime(item.time) : '';

        div.innerHTML = `
          <div class="task-left">
            <input 
              type="checkbox" 
              class="custom-checkbox" 
              ${item.completed ? 'checked' : ''} 
              onchange="toggleComplete('${item.id}')"
            />
            <div class="task-content">
              <span class="task-title">${escapeHtml(item.title)}</span>
              <div class="task-meta">
                <span class="badge p-${item.priority}">${item.priority}</span>
                <span class="category-tag">${item.category}</span>
                ${formattedTime ? `<span class="time-tag">🕒 ${formattedTime}</span>` : ''}
              </div>
            </div>
          </div>
          <button class="btn-delete" title="Delete Plan" onclick="deletePlan('${item.id}')">✕</button>
        `;
        taskListEl.appendChild(div);
      });
    }

    function formatTime(timeStr) {
      const [h, m] = timeStr.split(':');
      let hour = parseInt(h, 10);
      const ampm = hour >= 12 ? 'PM' : 'AM';
      hour = hour % 12 || 12;
      return `${hour}:${m} ${ampm}`;
    }

    function escapeHtml(text) {
      const d = document.createElement('div');
      d.textContent = text;
      return d.innerHTML;
    }

    // Handlers
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const title = titleInput.value.trim();
      if (!title) return;

      const newPlan = {
        id: Date.now().toString(),
        title,
        time: timeInput.value,
        category: catInput.value,
        priority: priorityInput.value,
        completed: false
      };

      plans.unshift(newPlan);
      titleInput.value = '';
      timeInput.value = '';
      saveAndRender();
    });

    window.toggleComplete = (id) => {
      plans = plans.map(p => p.id === id ? { ...p, completed: !p.completed } : p);
      saveAndRender();
    };

    window.deletePlan = (id) => {
      plans = plans.filter(p => p.id !== id);
      saveAndRender();
    };

    filterBar.addEventListener('click', (e) => {
      if (!e.target.classList.contains('filter-chip')) return;
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      e.target.classList.add('active');
      currentFilter = e.target.dataset.filter;
      renderTasks();
    });

    clearCompletedBtn.addEventListener('click', () => {
      plans = plans.filter(p => !p.completed);
      saveAndRender();
    });

    resetAllBtn.addEventListener('click', () => {
      if (confirm("Are you sure you want to clear all of tomorrow's plans?")) {
        plans = [];
        saveAndRender();
      }
    });

    // Initialize
    saveAndRender();
  </script>
</body>
</html>
